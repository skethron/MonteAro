<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Montearo Login</title>
    <style>
        /* Mensagem de erro do login */
        .error-msg {
            display: none;
            margin: -10px 0 15px;
            padding: 8px 12px;
            border: 2px solid #b00020;
            border-radius: 10px;
            color: #b00020;
            font-size: 14px;
            text-align: center;
        }
        .error-msg.show { display: block; }
        .login:disabled { opacity: .6; cursor: not-allowed; }
    </style>
</head>

<body>
    <main class="container">
        <form id="form-login" novalidate>
            <div class="login-logo">
                <img src="img.jpg/montearo-login.png" alt="Monte-Aro"/>
            </div>
            <div class="input-box">
                <input id="email" name="email" placeholder="Usuário" type="email" autocomplete="username" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input id="senha" name="senha" placeholder="Senha" type="password" autocomplete="current-password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input id="lembrar" type="checkbox">
                    Lembrar senha
                </label>
                <a href="#" id="esqueci-senha">Esqueci a senha</a>
            </div>

            <p id="erro" class="error-msg" role="alert"></p>

            <button type="submit" class="login" id="btn-login">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>

    </main>

    <!-- SDK do Firebase na versão "compat" (scripts comuns): assim o login
         também funciona quando o site é aberto com duplo clique (file://). -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
</body>

</html>
